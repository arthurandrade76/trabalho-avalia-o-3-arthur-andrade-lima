spring.application.name=nexus-gear-ecommerce
server.port=${PORT:8080}
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:sua_senha_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

supabase.api.url=${SUPABASE_API_URL:}
supabase.api.anon-key=${SUPABASE_ANON_KEY:}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusgear}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=5000ms

nexus.whatsapp.phone=${WHATSAPP_PHONE:5511999999999}
